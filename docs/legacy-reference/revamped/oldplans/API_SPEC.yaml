openapi: 3.1.0

info:
  title: Real Deal Kickz API
  version: 1.1.0
  description: |
    Real Deal Kickz — Public + Admin API for catalog, checkout, order lifecycle, and Stripe webhooks.
    All endpoints are version-locked under `/api/v1` and deployments are tied to Git tags:
    - `vX.Y.Z` → API version, DB migrations, and release artifacts are synchronized.
    - Staging + prod environments run the same OpenAPI version.

servers:
  - url: https://realdealkickz.vercel.app/api/v1
    description: Production
  - url: https://staging.realdealkickz.app/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Local development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests — edge rate limiting
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
        request_id:
          type: string
          description: Correlation ID for tracing across Vercel + Supabase + Sentry

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, nullable: true }
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        size_runs:
          type: array
          items: { type: string }
        condition:
          type: string
          enum: [new, used]
        images:
          type: array
          items: { type: string, format: uri }
        price: { type: number }
        inventory_strategy:
          type: string
          enum: [flat, per_size]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductCreateInput:
      type: object
      required: [sku, name, brand, price, condition, images]
      properties:
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        size_runs:
          type: array
          items: { type: string }
        condition:
          type: string
          enum: [new, used]
        images:
          type: array
          items: { type: string }
        price: { type: number }
        inventory_strategy:
          type: string
          enum: [flat, per_size]          

    ProductUpdateInput:
      type: object
      properties:
        name: { type: string }
        brand: { type: string }
        size_runs:
          type: array
          items: { type: string }
        condition:
          type: string
          enum: [new, used]
        images:
          type: array
          items: { type: string }
        price: { type: number }
        inventory_strategy:
          type: string
          enum: [flat, per_size]

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        tenant_id: { type: string, nullable: true }
        stripe_session_id: { type: string }
        subtotal: { type: number }
        shipping: { type: number }
        fee: { type: number }
        status:
          type: string
          enum: [pending, paid, shipped, canceled]
        created_at: { type: string, format: date-time }

    CheckoutRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    CheckoutResponse:
      type: object
      properties:
        url:
          type: string
          format: uri

paths:

  #############################################
  # PRODUCTS (Public + Admin)
  #############################################

  /products:
    get:
      summary: List all public products
      tags: [Products]
      description: |
        Public, cache-accelerated catalog read with ISR downstream caching.
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '429': { $ref: '#/components/responses/RateLimited' }

    post:
      summary: Create product (Admin-only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}:
    get:
      summary: Get single product by ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Not found

    put:
      summary: Update product (Admin)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateInput' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }

    delete:
      summary: Delete product (Admin)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '403': { $ref: '#/components/responses/Forbidden' }


  #############################################
  # CHECKOUT (Customer)
  #############################################

  /checkout/session:
    post:
      summary: Create a Stripe Checkout session
      tags: [Checkout]
      description: |
        Validates inventory → creates session via domain service → commits a pending order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400':
          description: Invalid request
        '429': { $ref: '#/components/responses/RateLimited' }


  #############################################
  # STRIPE WEBHOOK (Jobs)
  #############################################

  /stripe/webhook:
    post:
      summary: Stripe webhook endpoint (Finalizes orders)
      tags: [Stripe]
      description: |
        Backgroundable job seam. Validates signature, ensures idempotency, applies inventory sync,
        updates order status, and triggers cache invalidation tags.
      responses:
        '200':
          description: Acknowledged
        '400':
          description: Invalid signature or malformed event


  #############################################
  # CUSTOMER ORDERS
  #############################################

  /orders:
    get:
      summary: Get authenticated user's orders
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }


  #############################################
  # ADMIN ORDERS
  #############################################

  /admin/orders:
    get:
      summary: Admin-only list of all orders
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      description: |
        Supports future tenant filtering (tenant_id injected via repo layer).
      responses:
        '200':
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }


---
# Notes
- **Version Enforcement:** Every deployment corresponds to a Git tag and a validated OpenAPI version.
- **Rate Limiting:** `/api/*`, `/auth/*`, `/checkout/*`, `/admin/*` handled by Upstash edge middleware.
- **RLS Safety:** All data access is through repositories that inject tenant context when applicable.
- **Idempotency:** Stripe webhooks use idempotency tables/keys to prevent duplicate processing.
- **Cache Contract:** Product reads → static/ISR; user/order reads → no-store.
- **Request IDs:** Every request enriched with `x-request-id` and included in error responses.
